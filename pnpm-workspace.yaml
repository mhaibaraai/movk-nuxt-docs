packages:
  - layer
  - docs

ignoreWorkspaceRootCheck: true
linkWorkspacePackages: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Security fix for markdown rendering (GHSA-x9jw-j844-v24h).
  - '@nuxt/ui@4.12.2'

overrides:
  h3: 1.15.11
  typescript: ^6.0.3

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: false
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false
