title: Showcase
description: Every site below is built with Movk Nuxt Docs, from a personal blog to utility and component library docs. Use them as references for your own site.
navigation: false
hero:
  title: Showcase
  description: Every site below is built with Movk Nuxt Docs, from a personal blog to utility and component library docs. Use them as references for your own site.
  links:
    - label: Submit your site
      to: https://github.com/mhaibaraai/movk-nuxt-docs/edit/main/docs/content/en/templates.yml
      target: _blank
      icon: i-lucide-git-pull-request
    - label: Star on GitHub
      to: https://github.com/mhaibaraai/movk-nuxt-docs
      target: _blank
      icon: i-lucide-star
items:
  - title: mhaibaraai.cn
    description: A personal tech blog and knowledge base covering frontend engineering, the Nuxt ecosystem and day-to-day notes.
    features:
      - title: Technical Blog
        icon: i-lucide-notebook
      - title: Knowledge Base
        icon: i-lucide-library
    links:
      - label: Visit site
        to: https://mhaibaraai.cn
        target: _blank
  - title: '@movk/core'
    description: A library of Vue.js utilities and composables, documented with a full API reference and examples.
    features:
      - title: Utilities
        icon: i-lucide-wrench
      - title: Composables
        icon: i-lucide-package
    links:
      - label: Visit site
        to: https://core.mhaibaraai.cn
        target: _blank
  - title: '@movk/nuxt'
    description: A modular Nuxt 4 engineering toolkit with schema-driven forms, UI components, and utilities.
    features:
      - title: Schema-driven Forms
        icon: i-lucide-form-input
      - title: UI Components
        icon: i-lucide-shapes
      - title: Utilities
        icon: i-lucide-wrench
    links:
      - label: Visit site
        to: https://nuxt.mhaibaraai.cn
        target: _blank
  - title: '@movk/maplibre'
    description: A declarative MapLibre GL wrapper with no access token required, built-in 3D buildings, animated effects, drawing and multi-CRS support.
    features:
      - title: Declarative Components
        icon: i-lucide-code-xml
      - title: Animated Effects
        icon: i-lucide-sparkles
      - title: Local Coordinate Systems
        icon: i-lucide-map
    links:
      - label: Visit site
        to: https://maplibre.mhaibaraai.cn
        target: _blank
  - title: '@movk/sigma'
    description: A Nuxt module for knowledge graph visualization on sigma v4, covering rendering, interaction, layout and analysis for graphs with 1000+ nodes.
    features:
      - title: Knowledge Graphs
        icon: i-lucide-network
      - title: Layout and Analysis
        icon: i-lucide-chart-scatter
    links:
      - label: Visit site
        to: https://sigma.mhaibaraai.cn
        target: _blank
